name: Update prebuilt blobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "Galaxy A17 5G (a17xxx)"
            device: "a17xxx"
            firmware: "SM-A176B/INS/350042791234568"
          - module: "Galaxy A56 5G (a56xnaxx)"
            device: "a56xnaxx"
            firmware: "SM-A566B/EUX/352371191234565"
          - module: "Galaxy Tab S11 5G (gts11xx)"
            device: "gts11xx"
            firmware: "SM-X736B/EUX/R52Y8065XJM"
          - module: "Galaxy S23 FE (r11sxxx)"
            device: "r11sxxx"
            firmware: "SM-S711B/EUX/358615311234564"
          - module: "Galaxy Z Flip7 (b7sxxx)"
            device: "b7sxxx"
            firmware: "SM-F766B/EUX/350798020672197"
          - module: "Galaxy Tab S9 FE 5G (gts9fexx)"
            device: "gts9fexx"
            firmware: "SM-X516B/EUX/354136921234567"
          - module: "Galaxy A34 5G (a34xxx)"
            device: "a34xxx"
            firmware: "SM-A346B/EUX/351648447351835"
          - module: "Galaxy S24 (e1sxxx)"
            device: "e1sxxx"
            firmware: "SM-S921B/EUX/355680651388019"


    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          repository: 'Fede2782/MUN1CA'
          token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Compare latest version with current version
        run: |
          need_update=0
          CSC="$(echo ${{ matrix.firmware }} | cut -d'/' -f 2)"
          MODEL="$(echo ${{ matrix.firmware }} | cut -d'/' -f 1)"
          latest=`curl --retry 5 --retry-delay 5 -A "samsung $MODEL SyncML DM Client" http://fota-cloud-dn.ospserver.net/firmware/$CSC/$MODEL/version.xml | grep latest | sed 's/^[^>]*>//' | sed 's/<.*//'`
          current=`cat prebuilts/samsung/${{ matrix.device }}/.current` || need_update=1
          [[ $latest != $current ]] && need_update=1
          echo "need_update=$need_update" >> $GITHUB_ENV

      - name: Checkout submodules
        if: env.need_update == 1
        run: git submodule update --init --recursive --depth=1 --recommend-shallow

      - name: Free disk space (1/3)
        if: env.need_update == 1
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        if: env.need_update == 1
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        if: env.need_update == 1
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        if: env.need_update == 1
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        if: env.need_update == 1
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        if: env.need_update == 1
        run: |
          source ./buildenv.sh a34x
          ./scripts/build_dependencies.sh

      - name: Update prebuilt blobs
        if: env.need_update == 1
        run: |
          source ./buildenv.sh a34x
          ./scripts/internal/update_prebuilt_blobs.sh "${{ matrix.device }}" "${{ matrix.firmware }}"
          echo "PDA_BUILD=$(cat "./prebuilts/samsung/${{ matrix.device }}/.current" | cut -d "/" -f "1")" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: env.need_update == 1
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            prebuilts/samsung/${{ matrix.device }}
          commit-message: 'prebuilts/samsung/${{ matrix.device }}: update blobs to ${{ env.PDA_BUILD }}'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: 'prebuilts/samsung/${{ matrix.device }}'
          delete-branch: true
          title: 'Update prebuilts/samsung/${{ matrix.device }} blobs to ${{ env.PDA_BUILD }}'
          body: ''
          token: ${{ secrets.CROSS_REPO_PAT }}
